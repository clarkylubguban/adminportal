name: Catalog quick-row width one-shot

on:
  push:
    branches:
      - codex/catalog-quick-row-width-fix

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/catalog-quick-row-width-fix

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch Catalog quick-edit colspan
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.js')
          text = path.read_text(encoding='utf-8')
          old = '<tr class="catalog-product-quick-row">\n      <td colspan="11">'
          new = '<tr class="catalog-product-quick-row">\n      <td colspan="8">'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Catalog quick-row colspan=11 block, found {count}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build tracked dist mirror
        run: npm run build

      - name: Verify source and dist
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ('src/main.js', 'dist/src/main.js'):
              text = Path(filename).read_text(encoding='utf-8')
              expected = '<tr class="catalog-product-quick-row">\n      <td colspan="8">'
              bad = '<tr class="catalog-product-quick-row">\n      <td colspan="11">'
              if text.count(expected) != 1:
                  raise SystemExit(f'{filename}: expected one Catalog quick-row colspan=8 block.')
              if bad in text:
                  raise SystemExit(f'{filename}: stale Catalog quick-row colspan=11 remains.')
          PY

      - name: Remove one-shot workflow and commit fix
        run: |
          rm -f .github/workflows/catalog-quick-row-width-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js .github/workflows/catalog-quick-row-width-one-shot.yml
          git add -f dist/src/main.js
          git commit -m "Fix Catalog quick-edit table width"
          git push origin HEAD:codex/catalog-quick-row-width-fix
